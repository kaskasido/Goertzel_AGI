[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goertzel-agi"
version = "0.1.0"
description = "A teachable neuro-symbolic AI engine inspired by Ben Goertzel's OpenCog Hyperon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agi", "neuro-symbolic", "opencog", "hyperon", "pln", "knowledge-graph", "explainable-ai"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
docs = ["pypdf>=4", "python-docx>=1"]

[project.scripts]
goertzel-agi-server = "webui.server:main"

[tool.setuptools]
packages = ["goertzel_agi"]
